<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="OBIN GAME — PS4 Host">
  <base href="https://raw13g.github.io/">
  <title>OBIN GAME</title>
  <style>
    html,body{margin:0;padding:0;min-height:100%;background:#080d18;color:#c8ced8;font:15px/1.45 Arial,sans-serif}
    #brand{text-align:center;padding:12px 10px;background:#0e1116;border-bottom:1px solid #1e2732}
    #brand b{font-size:18px;font-weight:700;letter-spacing:.16em;color:#38bdf8}
    #spin{position:fixed;top:calc(50% + 20px);left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:4px solid #1e2732;border-top-color:#38bdf8;border-radius:50%;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #msg{position:fixed;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:16px;letter-spacing:.5px;display:none}
    #wrap{padding:0}
    #state,#out{display:none}
    body.done #spin,body.fail #spin{display:none}
    body.fail #msg,body.done #msg{display:block}
    body.done #msg{color:#7fd0a0;font-weight:700;letter-spacing:2px}
    body.log #spin,body.log #msg{display:none}
    body.log #wrap{padding:14px 18px}
    body.log #state{display:block;font-size:22px;font-weight:700;margin:0 0 8px}
    body.log #out{display:block;white-space:pre-wrap;font:12px/1.45 Consolas,monospace;background:#11151b;border:1px solid #1e2732;border-radius:5px;padding:10px 12px;height:calc(100vh - 141px);overflow-y:auto}
    .ok,.safe{color:#7fd0a0}.bad,.danger{color:#d08a7f}.warn{color:#d8c07f}code{color:#9fb3d0}
  </style>
</head>
<body>
  <div id="brand"><b>OBIN GAME</b></div>
  <div id="spin"></div>
  <div id="msg">Restart your console</div>
  <div id="wrap"><div id="state"></div><div id="out"></div></div>
  <script type="module">
    import "https://raw13g.github.io/jb.js?v=19";
  </script>
</body>
</html>
